[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crumb-kit"
# Single source of truth: breadcrumbs/__init__.py `__version__`. Read statically
# at build time (see [tool.setuptools.dynamic] below) so there is only ONE line
# to bump per release and no version literals to keep in sync.
dynamic = ["version"]
description = "Breadcrumbs — leave a trail your future self and your agents can follow back: a portable, repo-local, human-readable ledger of durable project state for human–agent software work."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["agent", "memory", "continuity", "cli", "project-memory", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
# Standard library only — there are no runtime dependencies, by design
# (plan §1 / non-goal 4: plain files + CLI work first, no third-party deps).
dependencies = []

# The MCP server (Phase 8) is the one optional interop layer. It is NOT a core
# dependency: the CLI and plain files work without it (graceful degradation,
# plan §3 / §13 "MCP later"). Install it explicitly with `pip install
# "crumb-kit[mcp]"`. The SDK needs Python >=3.10, hence the marker.
[project.optional-dependencies]
# Upper-bounded on purpose (MF-59). SDK 2.0 renamed the server class, and an
# unbounded `mcp>=1.2` silently resolved to it — the server then reported itself
# as "not installed". `mcp_server` supports both 1.x and 2.x; a future 3.x is
# assumed to break again until someone checks.
mcp = ["mcp>=1.2,<3; python_version >= '3.10'"]

# Contributor tooling. None of it is needed to *run* crumb-kit — the package has
# no runtime dependencies and the canonical test runner is stdlib `unittest`
# (what CI runs). This extra just declares the tools the repo's own workflows and
# docs reference, so `pip install -e ".[dev]"` gets you a working bench instead of
# a doc telling you to run a command nothing installed.
dev = [
    "pytest",       # optional alternative runner; `unittest discover` is canonical
    # Pinned, and the CI `lint` job installs the SAME pin — bump both together
    # (MF-69). A formatter is a moving spec: ruff 0.16 began formatting fenced
    # Python inside Markdown, which took the checked file set from 29 to 234 and
    # turned `lint` red on an untouched `main`. Every GitHub Action here is pinned
    # to a commit SHA for exactly this reason (MF-39); the tool that decides
    # pass/fail was the one thing left floating.
    "ruff==0.16.1", # lint + format, enforced by the `lint` CI job
    "build",        # `python -m build` (release dry-run)
    "twine",        # `twine check` / Path B upload
]

# Versioning note: this is the package version (semantic). It is independent of
# the *record* schema_version, which the manifest carries as `schema_version: 1`
# and `crumb --version` prints alongside the package version. A bump to the
# record schema is a separate, breaking change tracked by SCHEMA_VERSION in
# breadcrumbs/cli.py; the package MAJOR version moves with it.

[project.scripts]
crumb = "breadcrumbs.cli:main"
# Optional MCP server entry point. The script is always installed, but it only
# runs when the [mcp] extra is present; otherwise it prints install guidance and
# exits non-zero (it never imports the SDK at module load).
breadcrumbs-mcp = "breadcrumbs.mcp_server:main"

[project.urls]
Homepage = "https://github.com/jumbodaddystack/breadcrumbs"
Documentation = "https://github.com/jumbodaddystack/breadcrumbs/tree/main/docs"

[tool.setuptools.dynamic]
# Read the version literal from breadcrumbs/__init__.py without importing the
# package (setuptools parses the AST). Keeps a single source of truth.
version = { attr = "breadcrumbs.__version__" }

[tool.setuptools.packages.find]
include = ["breadcrumbs*"]

# Ship the .project-memory template tree as package data so `init` finds
# templates wherever the package is installed (never a repo-relative path).
# Explicit depth-1/depth-2 globs (not `**`) for setuptools-version robustness;
# .gitkeep files are bundled so `init` recreates the empty record directories.
[tool.setuptools.package-data]
breadcrumbs = [
    "templates/project-memory/*.md",
    "templates/project-memory/*.yml",
    "templates/project-memory/*/*.md",
    "templates/project-memory/*/*.yml",
    "templates/project-memory/*/.gitkeep",
]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
# `unittest discover -s tests` is canonical (it is what CI runs, and it needs no
# third-party package). pytest is supported for contributors who prefer it; this
# section keeps it from walking the whole tree and scattering a root
# `.pytest_cache` when it does.
testpaths = ["tests"]

[tool.ruff]
# The code was written to ~100 columns; the formatter is set to match so adopting
# it did not rewrap the whole codebase.
line-length = 100
target-version = "py39"   # the documented floor (requires-python >=3.9)

# The archived review/audit documents quote `cli.py` **verbatim as it was**, which
# is the whole point of keeping them (see docs/fix-list.md → MF-53). Since ruff
# 0.16 formats fenced Python inside Markdown, they became formatter input and it
# wanted to rewrap a quotation to today's style — silently falsifying the excerpt
# an old finding is evidence for. Living prose (README, CHANGELOG, the spec docs)
# stays in scope (MF-69).
extend-exclude = ["docs/crumb-kit-*.md"]

[tool.ruff.lint]
# ruff's default rules (pyflakes + the pycodestyle errors that indicate real
# problems) plus warnings. E501 (line-too-long) is deliberately NOT enabled:
# `ruff format` owns layout, and the lines it cannot split — long string literals,
# URLs, the record-schema tables in comments — are not defects worth failing CI
# over.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.format]
docstring-code-format = false   # the docstrings here are prose, not doctests
