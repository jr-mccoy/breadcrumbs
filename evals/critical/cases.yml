# Critical cases (audit WP18): assertions no baseline can approve.
#
# Each case is run against the named suite's store and is pass or fail on its
# own. An aggregate equal to the baseline does not excuse a failing case, and
# `--write-baseline` refuses to run while one fails. Checks:
#
#   guard_not          scoring.guard(task, files) must not return any `verdict_not`
#   guard_cites_none   scoring.guard(task, files) must cite none of the `forbid` ids
#   guard_no_blocking  scoring.guard(task, files) must show no match as blocking
#   hook_guard_warns   `crumb hook guard` on the task must deliver a warning
#   never_delivered    no `forbid` id is delivered as an entry (`via`: prompt, packet)
#   delivered          every `require` id is delivered (`via`, default prompt)
#   quiet              the prompt hook prints nothing for the task
#   delivery_bounded   every delivered packet and injection in the suite is
#                      within its declared budget, and every hook prints JSON
#
# `known: <finding>` marks a failure the repair program already tracks. It is
# reported on every run, and fails `--release`. When the case passes, the
# marker must be removed: a stale marker fails the run.
#
# `waiver: <reason>` marks a capability the project does not claim. It is
# reported and never gated. Adding either marker is a reviewed change to this
# file, never a baseline rewrite.
cases:
  # ---- false-safe verdicts on a recorded hazard ------------------------------
  - id: npm-test-hazard-is-not-proceed
    suite: webapp
    check: guard_not
    task: "npm test"
    verdict_not: [PROCEED]
    note: "trap_npm-test-truncates-db names this exact command (WP10: READ_FIRST)"

  - id: npm-test-hazard-hook-warns
    suite: webapp
    check: hook_guard_warns
    task: "npm test"

  - id: hand-tagging-a-release-is-not-proceed
    suite: library
    check: guard_not
    task: "tag the release commit by hand and push the tag"
    verdict_not: [PROCEED]

  - id: hand-tagging-a-release-hook-warns
    suite: library
    check: hook_guard_warns
    task: "tag the release commit by hand and push the tag"

  - id: failed-middleware-rewrite-is-not-proceed
    suite: service
    check: guard_not
    task: "rewrite the auth middleware to use the new session parser"
    files: [src/auth/middleware.py]
    verdict_not: [PROCEED]

  - id: failed-middleware-rewrite-hook-warns
    suite: service
    check: hook_guard_warns
    task: "rewrite the auth middleware to use the new session parser"
    files: [src/auth/middleware.py]

  - id: edit-of-a-decision-file-warns
    suite: holdout-ops
    check: hook_guard_warns
    task: "tidy the formatting"
    files: [infra/backend.tf]
    note: "only a decision declares this file; the hook's pre-filter used to skip the edit (F11, WP11)"

  - id: terraform-destroy-is-not-proceed
    suite: holdout-ops
    check: guard_not
    task: "terraform destroy the old staging stack"
    verdict_not: [PROCEED]

  # ---- relevant memory reaches the reader ------------------------------------
  - id: npm-test-prompt-delivers-its-trap
    suite: webapp
    check: delivered
    task: "npm test"
    require: [trap_npm-test-truncates-db]
    via: [prompt]
    note: "an 8-character prompt: the length gate that dropped it is gone (WP10)"

  - id: regressed-logout-verification-is-delivered
    suite: service
    check: delivered
    task: "logout no longer clears the session cookie"
    require: [ver_20260825_logout-clears-the-session-cookie-regressed]
    via: [prompt, packet]

  # ---- retired, superseded and speculative records never reach the reader ----
  - id: superseded-session-storage-never-delivered
    suite: webapp
    check: never_delivered
    task: "store the user's session after login"
    forbid: [dec_20260320_keep-the-login-session-in-localstorage]

  - id: superseded-inline-email-never-delivered
    suite: service
    check: never_delivered
    task: "send a welcome mail after signup"
    forbid: [dec_20260115_send-emails-synchronously-from-the-request-handler]

  - id: idea-never-delivered
    suite: library
    check: never_delivered
    task: "speed up the config parser"
    forbid: [idea_20260701_rewrite-the-config-parser-in-rust]

  - id: superseded-committed-secrets-never-delivered
    suite: holdout-ops
    check: never_delivered
    task: "add a new secret for the payments API key"
    forbid: [dec_20260115_store-secrets-as-kubernetes-secrets-in-the-repo-base64]

  # ---- silence on controls ---------------------------------------------------
  - id: unrelated-refactor-is-quiet
    suite: service
    check: quiet
    task: "refactor the retry loop in the HTTP client"

  - id: typo-fix-is-quiet
    suite: library
    check: quiet
    task: "fix a typo in the contributing guide"

  # ---- well-formed, bounded delivery -----------------------------------------
  - id: webapp-delivery-is-bounded
    suite: webapp
    check: delivery_bounded

  - id: service-delivery-is-bounded
    suite: service
    check: delivery_bounded

  - id: library-delivery-is-bounded
    suite: library
    check: delivery_bounded

  - id: holdout-delivery-is-bounded
    suite: holdout-ops
    check: delivery_bounded

  # ---- the DoWhat field report (2026-10-01; docs/reviews/2026-10-01-dowhat-field-report-plan.md)
  - id: android-robolectric-trap-delivered
    suite: android
    check: delivered
    task: "why is my robolectric test failing with a KeyStore error"
    require: [trap_robolectric-keystore-application]
    note: "issue 8: unrelated do-not-retry attempts sharing one tag pushed this trap out"

  - id: android-git-status-is-not-a-stop
    suite: android
    check: guard_not
    task: "git status"
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "issue 8: unrelated git attempts were labelled [objects]/blocking"

  - id: android-force-push-to-main-asks
    suite: android
    check: guard_not
    task: "git push --force origin main"
    verdict_not: [PROCEED, READ_FIRST, PAUSE]
    note: "decision D3: high-impact with no memory about it still asks a human"

  - id: android-gradlew-stop-asks
    suite: android
    check: guard_not
    task: "./gradlew --stop"
    verdict_not: [PROCEED, READ_FIRST]

  - id: android-read-only-compound-command-is-not-a-stop
    suite: android
    check: guard_not
    task: "cd app/build; grep -r 'CREATE TABLE' . 2>/dev/null"
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "issue 7a: `cd X;` and `2>/dev/null` used to forfeit the read-only cap"

  - id: android-xargs-rm-is-not-capped
    suite: android
    check: guard_not
    task: "find app/src -name '*.orig' | xargs rm -rf"
    verdict_not: [PROCEED, READ_FIRST]
    note: "N4: only the first word was checked, so this was 'read-only'"

  - id: android-migrate-preview-is-not-a-migration
    suite: android
    check: guard_not
    task: "crumb migrate --dry-run"
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "issue 7d"

  # ---- the DoWhat retest of 0.5.0 (docs/reviews/2026-10-02-dowhat-retest-plan.md)
  - id: android-sed-pipeline-is-read-only
    suite: android
    check: guard_not
    task: "sed -n '867p' app/lint-results.txt | grep -oiE 'MigrationV21ToV22Test|todos'"
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "item 1: `sed -n` was not read-only, and the hook gave PAUSE"

  - id: android-migrate-preview-piped-is-not-a-migration
    suite: android
    check: guard_not
    task: "crumb migrate --dry-run | sed -n '1,22p'"
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "item 2: the `| sed` made the dry run a migration"

  - id: android-real-migrate-cites-nothing-unrelated
    suite: android
    check: guard_cites_none
    task: "crumb migrate"
    forbid: [att_20260912_retrying-gradle-against-maven-central-on-a-cold-web, att_20260705_ran-the-room-migration-test-against-an-in-memory-database, att_20260910_migrationv21tov22test-s-todos-inserts-named-5-of-the-10, att_20260913_hunk-filtering-discipline-applied-to-the-kt-file-lost, trap_git-merge-conflict-in-project-memory]
    note: "item 3: high-impact verdicts cited a Gradle 429 attempt and a Room migration test"

  - id: android-real-migrate-still-asks
    suite: android
    check: guard_not
    task: "crumb migrate"
    verdict_not: [PROCEED, READ_FIRST, PAUSE]

  - id: android-handoff-note-is-not-paused
    suite: android
    check: guard_not
    task: "edit .project-memory/handoff.md: Migrated the store from schema 1 to 4; the migration kept every trap."
    files: [.project-memory/handoff.md]
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "item 4: memory prose was scored, and a todo/migration/schema attempt PAUSEd it"

  - id: android-handoff-note-cites-no-migration-attempt
    suite: android
    check: guard_cites_none
    task: "edit .project-memory/handoff.md: Migrated the store from schema 1 to 4; the migration kept every trap."
    files: [.project-memory/handoff.md]
    forbid: [att_20260910_migrationv21tov22test-s-todos-inserts-named-5-of-the-10]

  - id: android-script-comment-is-not-paused
    suite: android
    check: guard_not
    task: "edit tools/run.sh: # migrated the schema; re-run the todo migration check"
    files: [tools/run.sh]
    verdict_not: [PAUSE, ASK_HUMAN]
    note: "item 4: an ordinary shell script edit was PAUSEd on its comment"

  - id: android-routine-commands-skip-the-merge-decision
    suite: android
    check: guard_cites_none
    task: "cp app/src/main/res/values/strings.xml /tmp/strings.xml"
    forbid: [dec_20260911_merging-main-into-a-branch-always-conflicts-on-exactly]
    note: "item 5: the merge decision was cited on git status, reindex, cp and README edits"

  - id: android-reindex-skips-the-merge-decision
    suite: android
    check: guard_cites_none
    task: "crumb reindex"
    forbid: [dec_20260911_merging-main-into-a-branch-always-conflicts-on-exactly, att_20260910_migrationv21tov22test-s-todos-inserts-named-5-of-the-10]

  - id: android-git-status-shows-nothing-blocking
    suite: android
    check: guard_no_blocking
    task: "git status"
    note: "item 6: a read-only command showed a hunk-filtering attempt as [objects]"

  - id: android-capture-matches-its-own-files
    suite: android
    check: hook_guard_warns
    task: "crumb capture session --next 'publish 0.6.0 after the Windows retest'"
    note: "protect list: capture session matches the trap about the files it writes"

  - id: android-settings-button-colour-proceeds
    suite: android
    check: guard_not
    task: "change the color of the settings button"
    verdict_not: [READ_FIRST, PAUSE, ASK_HUMAN]
    note: "protect list"

  - id: android-rm-rf-src-asks
    suite: android
    check: guard_not
    task: "rm -rf app/src"
    verdict_not: [PROCEED, READ_FIRST, PAUSE]
    note: "protect list"

  - id: android-read-only-cd-grep-head-proceeds
    suite: android
    check: guard_not
    task: "cd app && grep -r Foo . 2>/dev/null | head"
    verdict_not: [READ_FIRST, PAUSE, ASK_HUMAN]
    note: "protect list"
