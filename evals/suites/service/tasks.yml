# Tasks for the service store. See webapp/tasks.yml for the keys.
as_of: 2026-09-01
tasks:
  - task: "rewrite the auth middleware to use the new session parser"
    note: "fixture 2's true positive: a failed rewrite of the same file"
    expect: [att_20260301_rewrote-the-auth-middleware-as-an-asgi-class, dec_20260210_session-tokens-are-parsed-by-src-auth-session-parser-py-only]
    files: [src/auth/middleware.py]
    verdict: [READ_FIRST, PAUSE]

  - task: "refactor the retry loop in the HTTP client"
    note: "fixture 3's false-positive control: nothing in the store is about this"
    expect: []
    verdict: [PROCEED]

  - task: "the db runs out of connections during deploys"
    note: "`db` reaches `database` through aliases.txt; the settled check has expired"
    expect: [dec_20260220_size-the-database-connection-pool-per-worker-process, att_20260315_used-pgbouncer-in-transaction-mode-in-front-of-postgres]
    reject: [ver_20260410_connection-pool-exhaustion-under-load-test-fixed]

  - task: "pg connections keep timing out"
    note: "only aliases.txt connects `pg` to the pool decision's `database`"
    expect: [dec_20260220_size-the-database-connection-pool-per-worker-process]

  - task: "rename the users.name column to full_name"
    expect: [att_20260402_autogenerated-a-migration-that-renamed-a-column, dec_20260305_schema-changes-go-through-alembic-migrations-never-create]

  - task: "send a welcome mail after signup"
    note: "`mail` reaches `email` through aliases.txt; the inline-SMTP decision is superseded"
    expect: [dec_20260418_send-emails-from-a-celery-worker]
    reject: [dec_20260115_send-emails-synchronously-from-the-request-handler]

  - task: "save uploaded profile avatars"
    expect: [dec_20260502_store-uploaded-avatars-in-s3-with-presigned-urls]
    reject: [dec_20260201_store-uploaded-avatars-on-local-disk]

  - task: "a celery task reads old data right after the request updated it"
    expect: [trap_celery-stale-db-session]

  - task: "subscriptions expire an hour early after the clocks change"
    expect: [trap_naive-datetimes]

  - task: "flush the rate limit keys in Redis"
    expect: [trap_ratelimit-redis-shared, dec_20260322_rate-limit-the-public-api-with-a-redis-sliding-window]

  - task: "log request bodies in the login endpoint for debugging"
    expect: [trap_log-request-bodies]

  - task: "logout no longer clears the session cookie"
    expect: [ver_20260825_logout-clears-the-session-cookie-regressed, att_20260301_rewrote-the-auth-middleware-as-an-asgi-class]

  - task: "should we throttle per API key or per account"
    expect: [q_should-the-rate-limit-be-per-api-key-or-per-acco-5bc85b]
    reject: [q_do-we-keep-the-pgbouncer-config-at-all]

  - task: "bump the markdown linter version"
    expect: []
