    expect: [dec_20260205_releases-are-cut-by-the-release-workflow-never-by-hand, trap_pypi-version-permanent, dec_20260202_the-version-lives-only-in-src-tool-init-py]

  - task: "tag the release commit by hand and push the tag"
    expect: [att_20260120_tagged-a-release-by-hand-before-bumping-the-version, dec_20260205_releases-are-cut-by-the-release-workflow-never-by-hand]
    verdict: [READ_FIRST, PAUSE, ASK_HUMAN]

  - task: "add PyYAML to parse the config file"
    expect: [att_20260218_used-pyyaml-for-the-config-parser, dec_20260220_parse-the-config-file-with-a-small-yaml-subset, dec_20260208_no-runtime-dependencies]
