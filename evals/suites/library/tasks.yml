  - task: "remove the upper bound on the mcp extra"
    expect: [att_20260405_left-the-mcp-extra-without-an-upper-bound]

  - task: "split a Windows path out of a command line string"
    expect: [trap_shlex-windows-paths]

  - task: "git log --oneline"
    expect: []
    verdict: [PROCEED, READ_FIRST]

  - task: "fix a typo in the contributing guide"
    expect: []
    verdict: [PROCEED]
