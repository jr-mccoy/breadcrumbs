name: release

# Publishes the Breadcrumbs package (PyPI name: crumb-kit) via Trusted Publishing
# (OIDC) — no API tokens are stored anywhere in this repo.
#
# HOW TO RELEASE (idiot-proof, one action):
#   1. Bump `__version__` in breadcrumbs/__init__.py (the single source of truth)
#      and add a CHANGELOG entry. Merge to main. That is the ONLY manual edit.
#   2. Actions → release → Run workflow, from the `main` branch:
#         mode = dry-run  -> build + validate only (publishes nothing)
#         mode = publish  -> build, validate, upload to PyPI, THEN create the
#                            git tag + GitHub Release on the exact commit built.
#
# Why this shape (learned the hard way):
#   * The workflow creates the tag itself, on the commit it just built, so the
#     tag can never point at a pre-bump commit. Hand-tagging was the #1 cause of
#     failed releases (a `vX` tag on a commit whose version was still X-1).
#   * The version lives in ONE place (breadcrumbs/__init__.py). pyproject reads it
#     dynamically; the CLI reads it as its source-checkout fallback. Nothing to
#     hand-sync, so a release can never ship a mislabeled binary.
#   * A PyPI version is PERMANENT. This workflow checks PyPI up front and fails
#     with a plain message ("already released — bump the version") instead of a
#     cryptic "400 File already exists" after the fact.
#   * PyPI is uploaded BEFORE the tag is cut, so a failed publish leaves no tag or
#     Release to clean up. If it failed *after* the upload, the version is on PyPI
#     with no tag — and re-running is the fix, not a dead end: the pre-flight
#     blocks on "already on PyPI" only when tag v$VERSION also exists. Published
#     but untagged is treated as a recovery: the upload no-ops (skip-existing) and
#     the tag + Release step finishes the job. Recover before merging anything
#     else, since the tag is cut on the commit this run builds.
#     (0.1.2 is the historical casualty of this: published, never tagged.)
#   * The full test suite runs in the build job, in BOTH modes, and `publish`
#     additionally requires the `ci` workflow to have succeeded on this commit —
#     a green smoke test is not evidence that the suite passes.
#
# One-time PyPI setup (already done; here for reference):
#   pypi.org "pending publisher": owner=jumbodaddystack, repo=breadcrumbs,
#   workflow=release.yml, environment=pypi. No secrets — OIDC mints a token per run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = build + validate only. publish = upload to PyPI, tag, and create the GitHub Release."
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

# Least privilege by default (review #5 Low). Both jobs already scope their own
# tokens (build reads the `ci` conclusion; publish needs OIDC + tag/Release write);
# this floor means a job added later cannot silently inherit the repo default.
permissions:
  contents: read

# A publish is irreversible, and the pre-flight's "is this version on PyPI?" check
# is a read followed much later by a write — two dispatches started together could
# both pass it and race to upload (review #5 Low). Serialize every run of this
# workflow, and never cancel one: cancelling mid-publish is how a version ends up
# on PyPI with no tag.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # read the `ci` workflow's conclusion for this commit
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # need tags for the pre-flight's tag check

      # A real publish must come from main. Fail loudly (before building) rather
      # than mint a release off a feature branch.
      - name: Publish must run from main
        if: github.event.inputs.mode == 'publish' && github.ref_name != 'main'
        run: |
          echo "::error::Releases must be cut from 'main' (got '${{ github.ref_name }}'). Merge to main, then re-run with 'main' selected in the branch dropdown."
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      # The suite the smoke test is not a substitute for (review #5 M11 / MF-12).
      # Stdlib-only, so it needs no install step and costs ~15 seconds; it runs in
      # dry-run too, which is what makes "dry-run first" worth doing.
      - name: Test suite (stdlib unittest)
        run: python -m unittest discover -s tests -p 'test_*.py'

      # A publish must not ship a commit whose CI failed. The suite above covers
      # the unit tests on 3.11; `ci` additionally runs the fixture/guard/MCP checks
      # and the full Python matrix, and it is the only place those exist.
      - name: CI succeeded on this commit
        if: github.event.inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
                  --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' 2>/dev/null || true)"
          if [ -z "$RUNS" ] || [ "$RUNS" = "null null null" ]; then
            echo "::warning::No 'ci' workflow run found for $GITHUB_SHA; continuing without that gate."
            exit 0
          fi
          STATUS="$(echo "$RUNS" | cut -d' ' -f1)"
          CONCLUSION="$(echo "$RUNS" | cut -d' ' -f2)"
          URL="$(echo "$RUNS" | cut -d' ' -f3)"
          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI is still $STATUS on $GITHUB_SHA ($URL). Wait for it to finish, then re-run."
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI concluded '$CONCLUSION' on $GITHUB_SHA ($URL). Fix it and merge before publishing."
            exit 1
          fi
          echo "CI succeeded on $GITHUB_SHA ($URL)."

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # The wheel filename is the authoritative built version. Because the version
      # is dynamic (read from breadcrumbs/__init__.py), this equals __version__ by
      # construction — there is no separate tag to mismatch.
      - name: Resolve built version
        id: ver
        run: |
          WHEEL="$(ls dist/crumb_kit-*-py3-none-any.whl)"
          VERSION="$(basename "$WHEEL" | sed -E 's/^crumb_kit-([^-]+)-py3-none-any\.whl$/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built crumb-kit $VERSION"

      # Pre-flight: PyPI state + tag state, decided together.
      #
      # Neither fact alone settles it. "Already on PyPI" with no tag is the
      # partial-publish state, and the ONLY way out of it is to let this run
      # continue and cut the tag — hard-failing there made the state permanent
      # (review #5 H5 / MF-11). The rules live in .github/scripts/release_preflight.py
      # so they are unit-tested (tests/test_release_process.py) rather than
      # discovered during a release.
      - name: Release pre-flight (PyPI + tag state)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/crumb-kit/$VERSION/json" || echo 000)"
          case "$CODE" in
            200) ON_PYPI=yes ;;
            404) ON_PYPI=no ;;
            *)   ON_PYPI=unknown ;;
          esac

          LATEST="$(curl -sS "https://pypi.org/pypi/crumb-kit/json" 2>/dev/null \
                    | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          echo "built=$VERSION  on_pypi=$ON_PYPI  latest_on_pypi=${LATEST:-?}  tag_exists=$TAG_EXISTS"
          python .github/scripts/release_preflight.py \
            --version "$VERSION" \
            --on-pypi "$ON_PYPI" \
            --latest-on-pypi "$LATEST" \
            --tag-exists "$TAG_EXISTS" \
            --mode "${{ github.event.inputs.mode }}"

      - name: Validate metadata (twine check)
        run: python -m twine check dist/*

      # Identity check against the tracked source tree — no duplicated magic
      # counts to keep in sync across workflows (review #3 R18).
      - name: Bundled templates match the tracked source tree
        run: |
          WHEEL="$(ls dist/crumb_kit-*.whl)"
          python - "$WHEEL" <<'PY'
          import subprocess, sys, zipfile
          wheel = sys.argv[1]
          src = set(subprocess.run(
              ["git", "ls-files", "breadcrumbs/templates/project-memory"],
              capture_output=True, text=True, check=True,
          ).stdout.split())
          bundled = {n for n in zipfile.ZipFile(wheel).namelist()
                     if n.startswith("breadcrumbs/templates/project-memory/")}
          assert src, "no template files tracked in git?"
          missing = src - bundled
          extra = bundled - src
          assert not missing, f"templates missing from wheel: {sorted(missing)}"
          assert not extra, f"unexpected wheel template entries: {sorted(extra)}"
          print(f"all {len(src)} tracked template files bundled, no extras.")
          PY

      - name: Installed-binary smoke test (mimics pipx)
        run: |
          python -m venv /tmp/cv
          /tmp/cv/bin/python -m pip install "$(ls dist/crumb_kit-*.whl)"
          /tmp/cv/bin/crumb --version | grep -E 'breadcrumbs [0-9]+\.[0-9]+\.[0-9]+ \(record schema_version [0-9]+\)'
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q && git config user.email t@t.t && git config user.name t
          git commit -q --allow-empty -m init
          /tmp/cv/bin/crumb init --session-tracking full
          /tmp/cv/bin/crumb validate

      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    # Real publish only when the operator explicitly chose `publish`.
    if: github.event.inputs.mode == 'publish'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crumb-kit
    permissions:
      id-token: write        # Trusted Publishing (OIDC)
      contents: write        # create the tag + GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      # PyPI first: it is the permanent, irreversible side. If it fails, no tag or
      # Release is created, so a re-run is clean. If it *succeeded* and the tag
      # step below failed, a re-run is also the fix: the pre-flight recognises
      # published-but-untagged as a recovery, this upload no-ops on skip-existing,
      # and the tag step completes the release (MF-11).
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1 @ 2026-07-25
        with:
          packages-dir: dist/
          # Tolerate a re-run after a partial upload instead of failing with
          # "400 File already exists".
          skip-existing: true

      # Only after PyPI accepted it do we record the release. The tag is created
      # on the exact commit that was built and published — it cannot mismatch.
      - name: Tag the published commit + create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
          echo "Tagged v$VERSION at $GITHUB_SHA and published the GitHub Release."
